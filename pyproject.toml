[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kibad-crawler"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Your name (or your organization/company/team)" }]
requires-python = ">=3.12.0"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "pandas>=2.3.3,<3.0.0",              # for zotero_download.py
    "pandas-stubs>=2.3.3,<3.0.0",        # for zotero_download.py
    "requests>=2.32.5",                  # for zotero_download.py
    "retry>=0.9.2",                      # for zotero_download.py
    "types-retry>=0.9.9.20250322",       # for zotero_download.py
    "defusedxml>=0.7.1",                 # for synch_nextcloud_with_cluster.py
    "types-defusedxml>=0.7.0.20250822",  # for synch_nextcloud_with_cluster.py
    "pymupdf4llm>=0.0.27",               # pdf to markdown conversion
    "jsonschema>=4.25.1",                # for structured output schema validation
    "types-jsonschema>=4.25.1.20251009",
    "tqdm>=4.67.1",
    "types-tqdm>=4.67.0.20250809",
    "typer>=0.19.2",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "pdfplumber>=0.11.7",
    "tabulate>=0.9.0",                   # to create markdown from pandas dataframes (e.g., in SaveJobReturnValueCallback)
    "gitpython>=3.1.45",
    "jupyter>=1.1.1,<2.0.0",             # to run jupyter notebooks
    "matplotlib>=3.10.8,<4.0.0",         # to run eval notebook (create plots)
    "pendulum>=3.2.0",
    "pyparsing>=3.3.2,<4.0.0",
    "pypdf>=6.18.0",
    "sifts>=1.3.1,<2.0.0",
]

[dependency-groups]
dev = [
    "prek>=0.5.2,<0.6.0",
    "zuban>=0.9.3,<0.10.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "typeguard>=4.6.0,<5.0.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/kibad_crawler"]

[tool.hatch.build.targets.wheel]
include = ["src/kibad_crawler"]

[tool.hatch.build.targets.wheel.sources]
"src/kibad_crawler" = "kibad_crawler"

[tool.pytest.ini_options]
typeguard-packages = "kibad_crawler"
minversion = "6.0"
testpaths = ["tests"]
addopts = ["--cov=kibad_crawler", "--cov-report=term-missing"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "typeguard_ignore: ignore typeguard in this test",
]

[tool.coverage.run]
branch = true
source = ["kibad_crawler"] # measure only your package (src layout is fine)

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 99
# limit Black’s directory walk to real Python files only (.py / .pyi);
# avoids touching other extensions and speeds discovery on large repos
include = '\.pyi?$'
# don’t even scan common “noise” dirs (.git, virtualenv) when walking the tree;
# keeps runs fast and prevents accidental formatting of vendored/ephemeral files.
# triple-quoted here on purpose: Black treats multiline patterns as “verbose”
# regex, making it easy to extend later.
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["kibad_crawler"]
force_sort_within_sections = true

[tool.flake8]
exclude = [
    ".git",
    "notebooks",
    "models",
    "data",
    "logs",
    ".src/kibad_crawler/string_queries",
]
ignore = [
    "E203",
    "E266",
    "E402",
    "E501",
    "F401",
    "F841",
    "C901",
    "W503",
    "E731",
    "E741",
]
max-line-length = 99

[tool.codespell]
exclude = [
    ".git",
    "notebooks",
    "models",
    "data",
    "logs",
    ".src/kibad_crawler/search_queries",
]
ignore-words-list = "hist"
skip = "logs/**,data/**,tests/fixtures/**.json,tests/fixtures/**.jsonl,*.ipynb,src/kibad_crawler/search_queries*,notebooks/query_strings.yml,docs/SEARCH_QUERIES.md,src/kibad_crawler/search_queries*"

# Bandit (read by pre-commit bandit with -c pyproject.toml)
[tool.bandit]
skips = ["B101", "B107", "B403"]
# optionally exclude tests to reduce noise:
# exclude_dirs = ["tests"]

# mdformat (via mdformat-pyproject); tweak if you want numbering/wrapping
[tool.mdformat]
wrap = "keep"      # {"keep","no",INTEGER}
number = false     # consecutive numbering for ordered lists
end_of_line = "lf"
validate = true

# (optional) nbQA-specific knobs if you need them later:
# [tool.nbqa.config]
# black = "pyproject.toml"
# isort = "pyproject.toml"
# flake8 = "pyproject.toml"

[tool.nbqa.addopts]
flake8 = ["--extend-ignore=E501"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]

#[[tool.mypy.overrides]]
#module = ["pymupdf4llm.*", "datasets.*", "llama_index.llms.openai_like.*"]
#follow_untyped_imports = true

[tool.pylint.messages_control]
disable = ["W1203", "W0718", "C0114"]

[project.scripts]
kibad-crawler = 'kibad_crawler.main:app'
